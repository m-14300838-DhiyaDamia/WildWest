const CO=matchMedia("(pointer:coarse)").matches,GA=CO?2.2:1.5,GN=["Thumb or flick","Thumb drop only","Hand flick down only"];let fr=0,hs=.2,gm=2,fh=[],fp=0,thOpen=.9,tp=100,calibOn=false,cx=innerWidth/2,cy=innerHeight/2,tx=cx,ty=cy,seen=0,hist=[],armed=true,lastFire=0,mn=1,mx=0,ck=[0,0,0,0],camOn=false,hands,busy=false,lastRes=0;

const hasHand=()=>performance.now()-seen<500;

addEventListener("pointerdown",e=>{ac().resume&&ac().resume();if(e.target.closest("button")||(e.target.closest(".card")&&!calibOn))return;calibOn&&tick(3);if(!hasHand()){cx=tx=e.clientX;cy=ty=e.clientY}shoot(cx,cy)});
function fire(){tick(3);const h=hist[0];if(h&&G.state=="play"){cx=tx=h.x;cy=ty=h.y}shoot(cx,cy)}
function onHand(res){lastRes=performance.now();const g=$("#hc").getContext("2d");g.clearRect(0,0,320,240);const L=res.multiHandLandmarks&&res.multiHandLandmarks[0];if(!L)return;
const now=performance.now();seen=now;tick(0);g.fillStyle="#3f3";CO||L.forEach(p=>{g.beginPath();g.arc(p.x*320,p.y*240,3,0,7);g.fill()});
const v0=$("#v"),k=(v0.videoWidth/(v0.videoHeight||1)||1.333)/1.333,d=(a,b)=>Math.hypot((L[a].x-L[b].x)*k,L[a].y-L[b].y),s=d(0,9)||1,idx=d(8,0)/s>1.5,pist=idx&&d(12,0)/s<1.6;
if(idx){const k=v=>Math.min(1,Math.max(0,v));tx=W*k((1-L[8].x-.5)*GA+.5);ty=H*k((L[8].y-.5)*GA+.5);hist.push({t:now,x:tx,y:ty});while(hist[0].t<now-(CO?420:250))hist.shift();
mn=Math.min(mn,L[8].x);mx=Math.max(mx,L[8].x);if(mx-mn>.15)tick(2)}
if(pist){tick(1);const td=d(4,9)/s;thOpen=Math.max(td,thOpen*.998,.55);tp=Math.round(td/thOpen*100);if(td>thOpen*.8)armed=true;if(gm!=2&&armed&&td<thOpen*.62&&now-lastFire>350){armed=false;lastFire=now;fire()}}
if(idx){hs=s;fh.push({t:now,y:L[9].y});while(fh[0].t<now-(CO?420:260))fh.shift();const ymin=Math.min(...fh.map(e=>e.y));fp=Math.round((L[9].y-ymin)/s*100);if(gm!=1&&fp>(CO?40:60)&&now-lastFire>600){lastFire=now;fh.length=0;tick(1);fire()}}else fh.length=0}
function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=u;s.onload=ok;s.onerror=()=>no("script");document.head.appendChild(s)})}

async function startCam(){msg("Starting camera…");
try{if(!navigator.mediaDevices)throw "open in Chrome or Safari, not inside WhatsApp/Telegram";const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:CO?320:480},height:{ideal:CO?240:360},frameRate:{ideal:30}},audio:false});const v=$("#v");v.srcObject=st;await v.play();$("#cam").classList.add("on");camOn=true;
msg("Loading hand tracking…");let T=0;try{await mkTasks();T=1}catch(e){}if(T){msg("Show your hand like a pistol 👉");pumpT();return}const B="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";await loadJS(B+"hands.js");

await Promise.race([hands.send({image:v}),new Promise((_,j)=>setTimeout(()=>j("timeout"),25000))]);msg("Show your hand like a pistol 👉");pump()}

let HL=null,lastT=-1,lastDet=0,errs=0;const cs=t=>{const e=$("#cs");e&&(e.textContent=t)};

const mk=d=>M.HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},runningMode:"VIDEO",numHands:1,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});

$("#cam").style.borderColor=n-seen<500?"#3f3":"#f44";if(gm!=1&&fh.length>1&&n-seen>150&&n-seen<500&&n-lastFire>600){const l=fh[fh.length-1],ym=Math.min(...fh.map(e=>e.y));if((l.y-ym)/hs>.3){lastFire=n;fh.length=0;fire()}}requestAnimationFrame(pumpT)}

/* ---------- game flow ---------- */
const ov=h=>{calibOn=false;const c=$("#cam");if(c.classList.contains("d")){document.body.appendChild(c);c.classList.remove("d")}const o=$("#ov");o.innerHTML=`<div class="card">${h}</div>`;o.style.display="flex"},cl=()=>$("#ov").style.display="none";
function clear(){tg.forEach(g=>g.userData.on=0);boss.visible=false}
function reg(){G.state="menu";clear();ov(`<h1>HAND GESTURE<br>QUIZ SHOOTER</h1><p><b>DAT20103 Database · Topic 3: DBLC</b></p><input id="pn" placeholder="Full name" autocomplete="off" value="${P?esc(P.name):""}"><input id="pm" placeholder="Matrix number" autocomplete="off" value="${P?esc(P.mat):""}"><select id="ps"><option value="">Select section</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}"${P&&P.sec==n?" selected":""}>Section ${n}</option>`).join("")}</select><p id="rm" style="color:#a3211a"></p><button class="btn g" onclick="login()">Enter the Saloon 🤠</button>`)}
function login(){const n=$("#pn").value.trim(),m=$("#pm").value.trim().toUpperCase(),c=$("#ps").value;if(!n||!m||!c){$("#rm").textContent="Please enter your name, matrix number and section.";return}P={name:n,mat:m,sec:c};musicOn();menu()}
function menu(){G.state="menu";clear();ov(`<h2>Howdy, ${esc(P.name)}! 🤠</h2><p>${esc(P.mat)} · Section ${esc(P.sec)}</p><button class="btn" onclick="newGame()">Start Game</button><button class="btn" onclick="howto()">How to Play</button><button class="btn" onclick="calib()">Calibration</button><button class="btn" onclick="sett()">Settings</button><button class="btn" id="tb" style="display:none" onclick="teacher()">📊 Lecturer Results</button><button class="btn" onclick="reg()">Change Player</button>`);
window.claude&&claude.use("user").then(u=>u&&(u.isOwner()||u.canEdit())&&($("#tb").style.display="block")).catch(()=>{})}
function howto(){ov(`<h2>HOW TO PLAY</h2><p><b>Use your hand like a pistol</b></p><p>👉 <b>AIM</b> – point your index finger at a target</p><p>👇 <b>SHOOT</b> – flick your whole hand quickly downward</p><p>Shoot the target with the correct answer. Right = +100 points (1 mark). Wrong or too slow = 0.</p><p><i>No camera? Move the mouse to aim and click (or tap on a phone) to shoot.</i></p><button class="btn" onclick="menu()">Back</button>`)}
function sett(){ov(`<h2>SETTINGS</h2><button class="btn" onclick="snd=!snd;this.textContent='Sound effects: '+(snd?'On':'Off')">Sound effects: ${snd?"On":"Off"}</button><button class="btn" onclick="toggleMus(this)">Music: ${mus?"On":"Off"}</button><button class="btn" onclick="gm=(gm+1)%3;this.textContent='Shoot: '+GN[gm]">Shoot: ${GN[gm]}</button><button class="btn" onclick="menu()">Back</button>`)}
function bye(){ov(`<h2>See you, partner! 🤠</h2><p>Close this tab whenever you’re ready, or ride again.</p><button class="btn" onclick="menu()">Back to Menu</button>`)}
function calib(){ck=[0,0,0,0];mn=1;mx=0;ov(`<h2>CALIBRATION</h2><p>Make sure your hand is clearly visible in the camera.</p><p><small>No camera? Just move your mouse or finger and tap to test aiming and shooting.</small></p><div id="slot"></div><ul><li id="k0">Hand detected</li><li id="k1">Pistol gesture recognised</li><li id="k2">Aiming works</li><li id="k3">Shooting works</li></ul><p id="msg"></p>${camOn?"":`<button class="btn" onclick="startCam()">Enable Camera</button>`}<button class="btn g" onclick="newGame()">Ready to Play!</button><button class="btn" onclick="menu()">Back</button>`);
calibOn=true;const c=$("#cam");$("#slot").appendChild(c);c.classList.add("d");ck.forEach((v,i)=>v&&tick(i));if(camOn)msg("Show your hand like a pistol 👉")}
function newGame(){G={state:"intro",lv:0,qi:0,score:0,lives:3,ok:0,bad:0,none:0,t:0,st:0,ans:0};startLevel()}
function startLevel(){clear();G.state="intro";setLevel(G.lv);const l=LV[G.lv];ov(`<h2>LEVEL ${G.lv+1} – ${l.n.toUpperCase()}</h2><p><b>${l.tp}</b></p><p>${l.s}</p><p>⏱ ${l.t}s per question</p><button class="btn g" onclick="go()">Let’s Ride!</button>`)}
function go(){cl();musicOn();beginQ()}
function hud(){$("#sc").textContent=G.score;$("#hp").textContent=`✔${G.ok} ✖${G.bad+G.none}`;$("#lv").textContent=`L${G.lv+1} · ${LV[G.lv].n}`}
function beginQ(){const q=Q[G.qi],p=[0,1,2,3].sort(()=>Math.random()-.5),o=[0,1,2,3].sort(()=>Math.random()-.5),s=sl();G.state="play";G.t=LV[G.lv].t;G.ans=o.indexOf(q[2]);
tg.forEach((g,i)=>{Object.assign(g.userData,{on:1,dead:0,d:0,glow:0,age:-i*.1,k:p[i],bx:s[p[i]][0],by:s[p[i]][1],ph:rnd(0,6)});g.rotation.z=0;g.userData.f.material.emissive.set(0)});
$("#qt").textContent=`Q${G.qi+1}/${Q.length}   Topic: ${LV[G.lv].tp}`;$("#qq").textContent=q[0];$("#opts").innerHTML=o.map((k,i)=>`<div class="o"><b>${"ABCD"[i]}</b>${esc(q[1][k])}</div>`).join("");boss.visible=G.lv==2;hud()}
function toast(a,b,c){const t=$("#t");t.innerHTML=`${a}<small>${b}</small>`;t.style.background=c;t.className="";void t.offsetWidth;t.className="show"}
function shoot(x,y){bang();rec=1;if(G.state!="play")return;const rc=new THREE.Raycaster();rc.setFromCamera({x:x/W*2-1,y:-(y/H*2-1)},cam3);
const h=rc.intersectObjects(tg.filter(g=>g.visible&&!g.userData.dead),true)[0];if(h){let o=h.object;while(!o.userData.t)o=o.parent;resolve(o.userData.i,h.point)}
else{tone(1400,.2,"sawtooth",.04,300);const gh=rc.intersectObject(ground)[0];gh&&burst(gh.point,0xd9a066,14)}}
function resolve(i,p){G.state="fb";const ok=i===G.ans;i>=0&&(tg[i].userData.dead=1);
if(ok){G.score+=100;G.ok++;G.st++;seq([523,659,784,1047],.18,"triangle",.2);burst(p,0x55ff66,70);toast("CORRECT!","+100 Points","#2fa84f");G.st%3==0&&yee("Yee haw!")}

async function submit(){const rec={name:P.name,matrix:P.mat,section:P.sec,correct:G.ok,wrong:G.bad,unanswered:G.none,total:Q.length,percent:Math.round(G.ok/Q.length*100),score:G.score,time:new Date().toISOString()};let ok=false;
try{const db=window.claude&&await claude.use("db");if(db){await db.collection("results").doc(P.mat.replace(/\W/g,"")+"_"+Date.now()).set(rec);ok=true}}catch(e){}
if(SHEET_URL)try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(rec)});ok=true}catch(e){}
const e=$("#sv");e&&(e.innerHTML=ok?"✅ Result sent to your lecturer!":"⚠ Couldn’t send. Check your internet, then <b onclick='submit()' style='text-decoration:underline;cursor:pointer'>tap here to retry</b>, or tap “Copy My Result”.")}
async function teacher(){ov(`<h2>RESULTS</h2><p>Loading…</p>`);try{const db=await claude.use("db"),sn=await db.collection("results").orderBy("time","desc").get(),rows=sn.docs.map(d=>d.data());
const fx=v=>{v=String(v==null?"":v);return /^[=+\-@]/.test(v)?"'"+v:v},qc=v=>'"'+fx(v).replace(/"/g,'""')+'"',head=["Name","Matrix","Section","Correct","Total","Percent","Submitted"],cells=r=>[r.name,r.matrix,r.section,r.correct,r.total,r.percent,r.time];
const csv=[head.map(qc),...rows.map(r=>cells(r).map(qc))].map(a=>a.join(",")).join("\r\n"),tsv=[head,...rows.map(r=>cells(r).map(v=>fx(v).replace(/[\t\n]/g," ")))].map(a=>a.join("\t")).join("\n");
ov(`<h2>RESULTS (${rows.length})</h2><div style="max-height:45vh;overflow:auto"><table>${rows.map(r=>`<tr><td>${esc(r.name)}<br><small>${esc(r.matrix)} · Sec ${esc(r.section)}</small></td><td>${esc(r.correct)}/${esc(r.total)}</td></tr>`).join("")}</table></div><button class="btn" id="tc">Copy for Google Sheets</button><button class="btn" id="td">Download CSV</button><button class="btn" onclick="menu()">Back</button>`);
$("#tc").onclick=()=>navigator.clipboard.writeText(tsv).then(()=>$("#tc").textContent="Copied – paste into Sheets ✔");

/* ---------- main loop ---------- */
let last=0;const fwd=new THREE.Vector3(0,0,-1),X=new THREE.Vector3(1,0,0),q2=new THREE.Quaternion();
function frame(ms){const t=ms/1000,dt=Math.min(.05,t-last);last=t;
const lk=hasHand()?(CO?.8:.55):.3;cx+=(tx-cx)*lk;cy+=(ty-cy)*lk;const live=G.state=="play"||G.state=="fb";
$("#x").style.display=(live||calibOn)?"block":"none";$("#hud").style.display=live?"flex":"none";$("#q").style.display=live?"block":"none";$("#x").style.transform=`translate(${cx}px,${cy}px)`;
if(G.state=="play"){const c0=Math.ceil(G.t);G.t-=dt;const c1=Math.ceil(G.t);$("#tm").textContent=Math.max(0,c1)+"s";if(c1<c0&&c1<=5&&c1>0)tone(900,.06,"square",.05);if(G.t<=0)resolve(-1)}
tg.forEach(g=>{const u=g.userData;if(!u.on){g.visible=false;return}u.age+=dt;let s=Math.max(0,Math.min(1,u.age*3));s=1-Math.pow(1-s,3);

else{const am=[0,.14,.24][G.lv]*hw,sp=[0,1.2,1.8][G.lv];g.position.set(u.bx+Math.sin(t*sp+u.ph)*am,u.by+Math.sin(t*1.4+u.ph)*.12,0);if(u.glow)s*=1+.08*Math.sin(t*10)}
g.scale.setScalar(Math.max(.001,s*r));g.visible=s>.02});
for(let i=0;i<NP;i++)if(pl[i]>0){pv[i*3+1]-=9*dt;for(let k=0;k<3;k++)pp[i*3+k]+=pv[i*3+k]*dt;pl[i]-=dt*1.2;if(pl[i]<=0)pp[i*3+1]=-99}
pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
tw.position.x+=dt*1.5;if(tw.position.x>hw+3)tw.position.x=-hw-3;tw.rotation.z-=dt*3;tw.position.y=.5+Math.abs(Math.sin(t*3))*.25;
rec=Math.max(0,rec-dt*6);gun.position.z=-.7+rec*.1;const th=Math.tan(cam3.fov*Math.PI/360),dir=new THREE.Vector3((cx/W*2-1)*th*cam3.aspect*8,-(cy/H*2-1)*th*8,-8).sub(gun.position).normalize();
gun.quaternion.setFromUnitVectors(fwd,dir).multiply(q2.setFromAxisAngle(X,rec*.3));fl.visible=rec>.75;ml.intensity=rec>.75?4:0;
if(!CO||++fr%3==0)R.render(S,cam3);requestAnimationFrame(frame)}
layout();setLevel(0);reg();requestAnimationFrame(frame);
